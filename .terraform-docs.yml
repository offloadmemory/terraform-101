# terraform-docs configuration (used by the pre-commit terraform_docs hook).
# Injects generated Requirements/Resources/Inputs/Outputs tables between the
# <!-- BEGIN_TF_DOCS --> and <!-- END_TF_DOCS --> markers in each module README.
formatter: markdown table

content: |-
  {{ .Requirements }}
  {{ .Resources }}
  {{ .Inputs }}
  {{ .Outputs }}

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
